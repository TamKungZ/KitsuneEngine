name: .NET Build

on:
  push:
    branches:
      - modules
    tags:
      - "v*"
  pull_request:
    branches:
      - modules

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore KitsuneEngine.sln

      - name: Build
        run: dotnet build KitsuneEngine.sln --configuration Release --no-restore
